<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Город едет</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0e1a2e;color:#fff;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:24px}
.sub{color:#8fa8c8;font-size:13px}
#badge{background:#22344f;border-radius:14px;padding:6px 12px;font-size:13px;color:#9fb4d0}
#badge.live{color:#6ee7a0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.chip{flex-shrink:0;background:#1a2c47;border:1px solid #2c4666;color:#cfe0f5;border-radius:20px;padding:10px 16px;font-size:14px;cursor:pointer}
.chip.on{background:#2f6fdb;border-color:#2f6fdb;color:#fff}
.card{background:#16263f;border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{color:#7ea6d8;font-size:15px;letter-spacing:.5px;margin-bottom:12px}
.dep{padding:10px 0;border-bottom:1px solid #223654}
.dep:last-child{border-bottom:none}
.dep .t{color:#f0c04a;font-weight:700}
.dep .p{color:#8fa8c8;font-size:13px;margin-top:4px}
#map{height:340px;border-radius:14px;overflow:hidden;position:relative}
.osm{position:absolute;bottom:0;right:0;background:rgba(20,30,48,.85);color:#cfe0f5;font-size:10px;padding:2px 6px;z-index:800}
.ads{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ads span{color:#8fa8c8}
#addad{background:transparent;border:1px solid #2f6fdb;color:#7ea6ff;border-radius:18px;padding:8px 14px;cursor:pointer}
.banner{background:#2450a4;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.banner .n{font-weight:700;font-size:17px}
.banner .d{color:#bcd2ee;font-size:12px;margin-top:4px}
.banner a{background:#f0c04a;color:#1a2c47;font-weight:700;text-decoration:none;border-radius:10px;padding:12px 16px;white-space:nowrap}
#form{margin-top:12px;display:none}
#form input,#form textarea{width:100%;background:#0e1a2e;border:1px solid #2c4666;color:#fff;border-radius:10px;padding:10px;margin-bottom:8px}
#form button{background:#2f6fdb;border:none;color:#fff;border-radius:10px;padding:10px 20px;cursor:pointer}
#diag{font-size:11px;color:#5c7ba3;margin-top:6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Город едет</h1>
    <div class="sub">Санкт-Петербург · Центральный район</div>
  </div>
  <div id="badge">● резерв</div>
</header>

<div class="chips" id="chips"></div>

<div class="card">
  <h2>БЛИЖАЙШИЕ РЕЙСЫ</h2>
  <div id="deps"></div>
</div>

<div class="card">
  <h2>ТРАНСПОРТ В ДВИЖЕНИИ</h2>
  <div id="live">Данных нет — показано движение по расписанию</div>
  <div id="diag"></div>
</div>

<div id="map"><div class="osm">© OpenStreetMap contributors</div></div>

<div class="card">
  <div class="ads">
    <span>Реклама</span>
    <button id="addad">+ Добавить рекламу</button>
  </div>
  <div id="form">
    <input id="adName" placeholder="Название компании">
    <input id="adPhone" placeholder="Телефон">
    <textarea id="adText" placeholder="Текст объявления"></textarea>
    <button id="sendAd">Отправить заявку</button>
  </div>
</div>

<div class="banner">
  <div>
    <div class="n">🛡 Защита тех</div>
    <div class="d">Видеонаблюдение · Сигнализация · Домофоны · Электромонтаж</div>
  </div>
  <a href="tel:+79600582810">8 960 058-28-10</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const R={
 A7:{n:'7 · Автобус',c:'#4a90e2',i:12,s:[['Московский вокзал',59.9180,30.3585],['Площадь Восстания',59.9256,30.3620],['Чернышевская',59.9443,30.3725],['Летний сад',59.9473,30.3264]]},
 A1:{n:'1 · Автобус',c:'#4a90e2',i:10,s:[['Московский вокзал',59.9180,30.3585],['Площадь Восстания',59.9256,30.3620],['Невский проспект',59.9340,30.3450],['Дворцовая площадь',59.9398,30.3146]]},
 T5:{n:'5 · Трамвай',c:'#e2894a',i:8,s:[['Сенная площадь',59.9265,30.3196],['Адмиралтейская',59.9365,30.3213],['Дворцовая площадь',59.9398,30.3146]]},
 T16:{n:'16 · Трамвай',c:'#e2894a',i:15,s:[['Сенная площадь',59.9265,30.3196],['Апраксин двор',59.9306,30.3250],['Казанский собор',59.9340,30.3230]]},
 T1:{n:'1т · Троллейбус',c:'#4ab06e',i:12,s:[['Невский проспект',59.9340,30.3450],['Летний сад',59.9473,30.3264],['Площадь Восстания',59.9256,30.3620]]},
 T9:{n:'9т · Троллейбус',c:'#4ab06e',i:10,s:[['Сенная площадь',59.9265,30.3196],['Невский проспект',59.9340,30.3450],['Московский вокзал',59.9180,30.3585]]}
};
let cur='A7',map,routeLine,stopMarks=[],vehMarks=[],liveVehicles=null,diag=[];

const chips=document.getElementById('chips');
for(const k in R){
 const b=document.createElement('button');
 b.className='chip'+(k===cur?' on':'');b.textContent=R[k].n;
 b.onclick=()=>{cur=k;[...chips.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');draw();};
 chips.appendChild(b);
}

map=L.map('map',{attributionControl:false,zoomControl:true}).setView([59.933,30.336],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function draw(){
 const r=R[cur];
 if(routeLine)map.removeLayer(routeLine);
 stopMarks.forEach(m=>map.removeLayer(m));vehMarks.forEach(m=>map.removeLayer(m));
 stopMarks=[];
 routeLine=L.polyline(r.s.map(p=>[p[1],p[2]]),{color:r.c,weight:4,opacity:.8}).addTo(map);
 r.s.forEach(p=>{
   const m=L.circleMarker([p[1],p[2]],{radius:6,color:'#f0c04a',fillColor:'#16263f',fillOpacity:1,weight:2}).addTo(map);
   m.bindTooltip(p[0]);stopMarks.push(m);
 });
 const now=new Date(),deps=document.getElementById('deps');deps.innerHTML='';
 const min=now.getHours()*60+now.getMinutes();
 const off=min%r.i, first=r.i-off;
 [first,first+r.i,first+2*r.i].forEach(d=>{
   const h=Math.floor((min+d)/60)%24,mm=(min+d)%60;
   const e=document.createElement('div');e.className='dep';
   const path=r.s.map(p=>p[0]).join(' → ');
   e.innerHTML='<span class="t">'+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')+'</span> '+path;
   deps.appendChild(e);
 });
 if(!liveVehicles){
  const t=Date.now()/60000, veh=document.getElementById('live');
  veh.textContent='Данных нет — показано движение по расписанию';veh.style.color='#8fa8c8';
  for(let v=0;v<3;v++){
   const prog=((t/r.i)+v/3)%1, idx=Math.min(r.s.length-2,Math.floor(prog*(r.s.length-1)));
   const a=r.s[idx],b=r.s[idx+1],f=(prog*(r.s.length-1))%1;
   const lat=a[1]+(b[1]-a[1])*f,lng=a[2]+(b[2]-a[2])*f;
   vehMarks.push(L.circleMarker([lat,lng],{radius:5,color:'#fff',fillColor:'#0e1a2e',fillOpacity:1,weight:2}).addTo(map));
  }
 }
}

function pb(d){
 let i=0;const out=[];
 while(i<d.length){
  let k=0,sh=0;
  while(1){const b=d[i++];k|=(b&127)<<sh;if(!(b&128))break;sh+=7;}
  const f=k>>3,t=k&7;let v;
  if(t===0){let x=0n;sh=0;while(1){const b=d[i++];x|=BigInt(b&127)<<BigInt(sh);if(!(b&128))break;sh+=7;}v=Number(x);}
  else if(t===2){let l=0;sh=0;while(1){const b=d[i++];l|=(b&127)<<sh;if(!(b&128))break;sh+=7;}v=d.slice(i,i+l);i+=l;}
  else if(t===5){v=d.slice(i,i+4);i+=4;}
  else if(t===1){v=d.slice(i,i+8);i+=8;}
  else break;
  out.push([f,t,v]);
 }
 return out;
}
const f2=(fld,n)=>(fld.find(x=>x[0]===n)||[,,,])[2];
function parsePos(pos){
 const P=pb(pos);
 let lat=0,lng=0;
 for(const[f,t,v]of P){
  if(f===1)lat=(t===0?Number(v):0)/1e7;
  if(f===2)lng=(t===0?Number(v):0)/1e7;
 }
 return{lat,lng};
}
function parseFeed2(bytes){
 const feed=pb(bytes);const res=[];
 for(const[f,t,v]of feed){
  if(f!==2||t!==2)continue;
  const ent=pb(v);
  const vp=f2(ent,3);
  if(!vp)continue;
  const vpF=pb(vp);
  const trip=f2(vpF,1),pos=f2(vpF,2);
  if(!pos)continue;
  const{lat,lng}=parsePos(pos);
  let route='?';
  if(trip){const rid=f2(pb(trip),5);if(rid)route=new TextDecoder().decode(rid);}
  res.push({lat,lng,route});
 }
 return res;
}

const FEED='https://transport.orgp.spb.ru/Portal/transport/internalapi/gtfs/realtime/vehicle?bbox=30.28,59.90,30.42,59.96&transports=bus,tram,trolley';
const enc=encodeURIComponent(FEED);
const tries=[
 ['прямой',FEED],
 ['allorigins','https://api.allorigins.win/raw?url='+enc],
 ['corsproxy','https://corsproxy.io/?url='+enc],
 ['allorigins64','https://api.allorigins.win/get?url='+enc]
];

async function tryLive(){
 diag=[];
 vehMarks.forEach(m=>map.removeLayer(m));vehMarks=[];
 for(const[nm,url]of tries){
  try{
   const r=await fetch(url);
   if(!r.ok){diag.push(nm+': HTTP '+r.status);continue;}
   let bytes;
   if(nm==='allorigins64'){
    const j=await r.json();
    bytes=Uint8Array.from(atob(j.contents),c=>c.charCodeAt(0));
   }else{
    bytes=new Uint8Array(await r.arrayBuffer());
   }
   if(!bytes.length){diag.push(nm+': 0 байт');continue;}
   const veh=parseFeed2(bytes);
   if(!veh.length){diag.push(nm+': машин не найдено');continue;}
   liveVehicles=veh;
   veh.forEach(v=>{
    const m=L.circleMarker([v.lat,v.lng],{radius:6,color:'#fff',fillColor:'#e2894a',fillOpacity:1,weight:2}).addTo(map);
    m.bindTooltip('маршрут '+v.route);vehMarks.push(m);
   });
   const b=document.getElementById('badge');
   b.textContent='● live';b.classList.add('live');
   document.getElementById('live').textContent='Живые данные · машин в районе: '+veh.length;
   document.getElementById('diag').textContent='';
   return;
  }catch(e){diag.push(nm+': нет ответа');}
 }
 liveVehicles=null;
 document.getElementById('diag').textContent=diag.join(' | ');
 draw();
}
draw();tryLive();setInterval(tryLive,30000);

document.getElementById('addad').onclick=()=>{const f=document.getElementById('form');f.style.display=f.style.display==='block'?'none':'block';};
document.getElementById('sendAd').onclick=()=>{
 const n=document.getElementById('adName').value.trim();
 if(!n)return alert('Укажи название');
 const list=JSON.parse(localStorage.getItem('ads')||'[]');
 list.push({n,ph:document.getElementById('adPhone').value.trim(),t:document.getElementById('adText').value.trim()});
 localStorage.setItem('ads',JSON.stringify(list));
 alert('Заявка сохранена');
 document.getElementById('form').style.display='none';
};
</script>
</body>
</html>
